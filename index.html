.boot-corner{position:absolute;width:30px;height:30px;border-color:#78c8e4;border-style:solid;opacity:.9}.boot-corner.tl{top:7px;left:7px;border-width:2px 0 0 2px}.boot-corner.tr{top:7px;right:7px;border-width:2px 2px 0 0}.boot-corner.bl{bottom:7px;left:7px;border-width:0 0 2px 2px}.boot-corner.br{bottom:7px;right:7px;border-width:0 2px 2px 0}
.boot-kicker{font-size:10px;letter-spacing:.28em;color:#78c8e4;font-weight:900}.boot-logo-wrap{height:170px;display:grid;place-items:center;margin:10px 0 3px}.boot-logo{width:158px;height:158px;object-fit:contain;opacity:0;filter:drop-shadow(0 0 18px #3988ff88);animation:logo-power 1.55s steps(1,end) .12s forwards}.boot-numbers{font-size:clamp(54px,11vw,76px);line-height:1;font-weight:1000;letter-spacing:.13em;color:#f5f9ff;text-shadow:0 0 22px #3988ff3b}.boot-subtitle{margin-top:12px;font-size:clamp(17px,3vw,24px);font-weight:950;letter-spacing:.22em;color:#f5f9ff;text-shadow:0 0 22px #3988ff66}.boot-event-line{margin-top:8px;font-size:10px;font-weight:800;letter-spacing:.25em;color:#78c8e4}.boot-progress{height:4px;margin:23px auto 12px;max-width:300px;background:#14283a;overflow:hidden}.boot-progress span{display:block;height:100%;width:0;background:#78c8e4;box-shadow:0 0 12px #78c8e4;animation:boot-load 2.15s ease-out .2s forwards}.boot-status{font-size:9px;letter-spacing:.18em;color:#6889a3;text-transform:uppercase;animation:status-pulse .55s steps(2,end) infinite}
@keyframes logo-power{0%{opacity:0;filter:brightness(0)}8%{opacity:1;filter:brightness(2.5) drop-shadow(0 0 20px #78c8e4)}13%{opacity:.15}19%{opacity:1;filter:brightness(1.8) drop-shadow(0 0 22px #3988ff)}24%{opacity:.25}31%,100%{opacity:1;filter:brightness(1) drop-shadow(0 0 18px #3988ff88)}}
@keyframes boot-load{to{width:100%}}@keyframes boot-scan{from{transform:translateY(-8px)}to{transform:translateY(8px)}}@keyframes status-pulse{50%{opacity:.45}}
@media(max-width:700px){.sidebar{position:static}.boot-frame{padding:27px 15px 20px}.boot-logo-wrap{height:135px}.boot-logo{width:125px;height:125px}.boot-numbers{letter-spacing:.09em}}

function rsvpPage(){
const people=[...state.rsvps].sort((a,b)=>a.name.localeCompare(b.name));
return pageHead('Registration desk','RSVPs & robot assignments','Only the organizer can add players, then assign each participant a unique robot.',state.isAdmin?`<button class="btn primary" onclick="showAddPlayer()">＋ Add player</button>`:'')+
(!state.isAdmin?`<div class="notice">Organizer access is required to manage the roster. Participants should check in with the organizer to be signed in.</div>`:'')+
`<div class="panel"><div class="panelhead"><h2>Participant roster</h2><div class="row"><span class="pill">${people.length} players</span>${state.isAdmin?`<button class="btn small" onclick="showRobotImport()">Import robot list</button><button class="btn small" type="button" onclick="return randomAssignRobots(event)">🎲 Randomly assign all robots</button><button class="btn primary" onclick="showAddPlayer()">＋ Add player</button>`:''}</div></div>
${!state.isAdmin?`<div class="empty">Player registration is managed by the tournament organizer. Players cannot add themselves. Contact the organizer to be included in the event.</div>`:''}
${people.length?`<div class="tablewrap"><table><thead><tr><th>Player</th><th>Status</th><th>Assigned robot</th><th>Actions</th></tr></thead><tbody>${people.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="pill ${p.approved?'green':'orange'}">${p.approved?'Approved':'Pending'}</span></td><td>${esc(robotName(p))}</td><td>${state.isAdmin?`<div class="row"><button class="btn small" onclick="approvePlayer('${p.id}')">${p.approved?'Unapprove':'Approve'}</button><button class="btn small" type="button" onclick="assignRobot('${p.id}',event)">Assign robot</button><button class="btn small danger" type="button" onclick="return removePlayer('${p.id}',event)">Remove</button></div>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No participants have been signed in yet. Add the first participant above.</div>`}</div>
<div class="panel"><div class="panelhead"><h2>Robot inventory</h2><span class="pill">${state.robots.length} assignments</span></div><p class="smalltext">${state.availableRobots.length} simulator robots available. Each robot can only be assigned once. High Tide and 9442 are excluded.</p>${state.robots.length?`<div class="tablewrap"><table><thead><tr><th>Robot</th><th>Assigned player</th><th></th></tr></thead><tbody>${state.robots.map(r=>`<tr><td><b>${esc(r.robot)}</b></td><td>${esc(state.rsvps.find(p=>p.id===r.playerId)?.name||'Unknown player')}</td><td>${state.isAdmin?`<button class="btn small danger" onclick="unassignRobot('${r.playerId}')">Unassign</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No robots assigned yet.</div>`}</div>
<div class="panel robot-catalog"><div class="panelhead"><h2>Simulator robot catalog <span class="section-index">/ TBA TEAM PROFILES</span></h2><span class="pill">${state.availableRobots.length} ROBOTS</span></div><p class="smalltext">Team names and logo avatars link to The Blue Alliance. Logos load from TBA, so an internet connection is required to display them. The Lowlanders (9999) is the custom V2 entry and links to Team 4499 on The Blue Alliance.</p><div class="robot-catalog-grid">${state.availableRobots.map(name=>{const tba=ROBOT_TBA_URL(name),avatar=ROBOT_AVATAR_URL(name);return `<a class="robot-catalog-item" href="${tba}" target="_blank" rel="noopener"><img src="${avatar}" alt="${esc(name)} logo" loading="lazy" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%228%22 fill=%22%230c1c2a%22/%3E%3Ctext x=%2232%22 y=%2238%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2218%22 fill=%22%237bdcff%22%3E${ROBOT_TEAM_NUM(name)}%3C/text%3E%3C/svg%3E'"><span class="robot-catalog-team">${esc(name)}</span><span class="robot-catalog-link">VIEW TEAM ↗</span></a>`}).join('')}</div>${state.isAdmin?`<div style="margin-top:14px"><button class="btn small" onclick="showRobotImport()">Edit robot catalog</button></div>`:''}</div>`;

function showAddPlayer(){modal(`<h2>Add participant</h2><form onsubmit="addPlayer(event)"><div class="field"><label>Player name</label><input id="newPlayerName" required maxlength="60" placeholder="Full name"></div><label class="inlinecheck" style="margin:12px 0"><input id="approveNow" type="checkbox" checked> Approve immediately</label><div class="row"><button class="btn primary" type="submit" onclick="addPlayer(event)">Add player</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function addPlayer(e){if(e){e.preventDefault();e.stopPropagation()}const field=$('#newPlayerName');if(!field)return false;const name=String(field.value||'').trim();if(!name){field.focus();toast('Enter a player name first.');return false}if(state.rsvps.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('That name is already registered.');return false}const approveField=$('#approveNow');state.rsvps.push({id:uid(),name,approved:approveField?approveField.checked:true,created:Date.now()});save();closeModal();render();toast('Participant added.');return false}
function publicRsvp(e){e.preventDefault();const name=$('#publicName').value.trim();if(!name)return;if(state.rsvps.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('That name is already registered.');state.rsvps.push({id:uid(),name,approved:false,created:Date.now()});save();render();toast('Check-in recorded. The organizer must approve it.')}
function approvePlayer(id){if(!state.isAdmin)return;const p=state.rsvps.find(p=>p.id===id);if(!p)return;p.approved=!p.approved;if(!p.approved)unassignRobot(id,true);save();render()}
function removePlayer(id,e){if(e){e.preventDefault();e.stopPropagation()}if(!state.isAdmin)return toast('Organizer login is required.');const p=state.rsvps.find(p=>p.id===id);if(!p)return toast('Player not found.');modal(`<h2>Remove player?</h2><p>Remove <b>${esc(p.name)}</b> from the event? Their robot assignment will be cleared. If a schedule or alliance draft already exists, those dependent results will be reset to prevent invalid teams.</p><div class="row" style="margin-top:14px"><button class="btn danger" type="button" onclick="confirmRemovePlayer('${p.id}',event)">Remove player</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div>`);return false}
function confirmRemovePlayer(id,e){if(e){e.preventDefault();e.stopPropagation()}if(!state.isAdmin)return toast('Organizer login is required.');if(!state.rsvps.some(p=>p.id===id))return toast('Player not found.');state.rsvps=state.rsvps.filter(p=>p.id!==id);state.robots=state.robots.filter(r=>r.playerId!==id);if(state.matches.length){state.matches=[];state.alliances=[];state.bracket=[];state.champion=null;state.celebrationShown=false}save();closeModal();render();toast('Player removed. Any dependent schedule and bracket were reset.');return false}
function showRobotImport(){modal(`<h2>Robot inventory</h2><p>Edit the 24-team REBUILD Simulator roster. One robot per line. High Tide, 9442, 359, 4180, 4907, 4999, and 10079 are excluded.</p><form onsubmit="importRobots(event)"><div class="field"><label>Robot names</label><textarea id="robotText" rows="10" style="width:100%;background:#0c141d;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px" placeholder="Robot 1&#10;Robot 2&#10;Robot 3">${esc((state.availableRobots?.length?state.availableRobots:REBUILDSIM_ROSTER).join("\n"))}</textarea></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="importRobots(event)">Save inventory</button><button class="btn" type="button" onclick="loadRebuildSimRoster()">Reload full simulator roster</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function loadRebuildSimRoster(){const field=$("#robotText");if(field)field.value=REBUILDSIM_ROSTER.join("\n");toast("Loaded all 24 robots from your supplied simulator roster.")} 
function importRobots(e){e.preventDefault();const names=$('#robotText').value.split(/[\r\n,;]+/).map(x=>x.trim()).filter(Boolean);const filtered=[...new Set(names)].filter(n=>!isExcludedRobot(n));if(filtered.length<3)return toast('Please provide at least 3 eligible robot names.');const old=state.robots;state.robots=old.filter(r=>filtered.includes(r.robot));const used=new Set(state.robots.map(r=>r.robot));state.robots.forEach(r=>{if(!state.rsvps.some(p=>p.id===r.playerId&&p.approved))r.playerId=null});state.rsvps.filter(p=>p.approved&&!robotFor(p)).forEach(p=>{const next=filtered.find(n=>!used.has(n));if(next){state.robots.push({robot:next,playerId:p.id});used.add(next)}});state.availableRobots=filtered;save();closeModal();render();toast(`Saved ${filtered.length} eligible robots. Assign players from the roster.`)}

function saveAssignment(e,id){if(e){e.preventDefault();e.stopPropagation()}const choice=$('#robotChoice');const robot=String(choice?.value||'');if(!robot){toast('Choose a robot first.');return false}const p=state.rsvps.find(p=>p.id===id);if(!p||!p.approved){toast('Approve this participant first.');return false}const existing=state.robots.find(r=>r.robot===robot);if(existing&&existing.playerId!==id){toast('That robot is already assigned.');return false}state.robots=state.robots.filter(r=>r.playerId!==id);state.robots.push({robot,playerId:id});save();closeModal();render();toast('Robot assigned.');return false}
function randomAssignRobots(e){

function confirmRandomAssignRobots(e){if(e){e.preventDefault();e.stopPropagation();}if(!state.isAdmin){closeModal();toast('Organizer login is required.');return false;}const players=state.rsvps.filter(p=>p.approved);const eligible=[...new Set((state.availableRobots||[]).filter(r=>!isExcludedRobot(r)))];if(!players.length){closeModal();toast('Approve at least one player first.');return false;}if(eligible.length<players.length){closeModal();toast(`There are only ${eligible.length} eligible robots for ${players.length} approved players.`);return false;}for(let i=eligible.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[eligible[i],eligible[j]]=[eligible[j],eligible[i]];}const assignments=players.map((p,i)=>({robot:eligible[i],playerId:p.id}));const approvedIds=new Set(players.map(p=>p.id));state.robots=state.robots.filter(r=>!approvedIds.has(r.playerId)&&!assignments.some(a=>a.robot===r.robot));state.robots.push(...assignments);save();closeModal();render();toast(`Randomly assigned unique robots to all ${players.length} approved players.`);return false;}

`<div class="cards"><div class="card"><div class="label">SCHEDULED</div><div class="metric">${totalMatches()}</div></div><div class="card"><div class="label">COMPLETED</div><div class="metric">${countDone()}</div></div><div class="card"><div class="label">PLAYERS</div><div class="metric">${assigned().length}</div></div><div class="card"><div class="label">ROUNDS / ROBOT</div><div class="metric">${state.config.matchesPerRobot||'Auto'}</div></div></div>

function matchTable(matches,editable){if(!matches.length)return '<div class="empty">All matches have been completed.</div>';return `<div class="tablewrap"><table><thead><tr><th>Match</th><th>Red alliance</th><th>Blue alliance</th><th>Score</th><th>Status</th><th>Result / action</th></tr></thead><tbody>${matches.map(m=>`<tr><td><b>Q${m.n}</b></td><td><span class="redtxt">${m.red.map(id=>robotLabel(robotFor(state.rsvps.find(p=>p.id===id)||{})?.robot||'?',22)).join(' ')}</span></td><td><span class="bluetxt">${m.blue.map(id=>robotLabel(robotFor(state.rsvps.find(p=>p.id===id)||{})?.robot||'?',22)).join(' ')}</span></td><td>${m.completed?`${m.redScore} – ${m.blueScore}`:'—'}</td><td><span class="pill ${m.completed?'green':'orange'}">${m.completed?'Completed':'Scheduled'}</span></td><td>${editable&&state.isAdmin?`<button class="btn small" onclick="scoreMatch('${m.id}')">${m.completed?'Edit score':'Enter score'}</button>`:m.completed?`<span class="pill ${m.redScore===m.blueScore?'orange':m.redScore>m.blueScore?'red':'blue'}">${m.redScore===m.blueScore?'Tie':m.redScore>m.blueScore?'Red wins':'Blue wins'}</span>`:'Pending'}</td></tr>`).join('')}</tbody></table></div>`}
function simulateAllQuals(e){if(e){e.preventDefault();e.stopPropagation();}if(!state.isAdmin){toast('Organizer login is required.');return false;}if(!state.matches.length){toast('Generate the qualification schedule first.');return false;}modal(`<h2>Simulate qualification matches?</h2><p>This will generate fictional scores and FUEL totals for all <b>${state.matches.length} qualification matches</b>, including any matches already scored. This is for bracket testing only.</p><div class="row" style="margin-top:14px"><button class="btn primary" type="button" onclick="confirmSimulateAllQuals(event)">Simulate all matches</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div>`);return false;}
function confirmSimulateAllQuals(e){if(e){e.preventDefault();e.stopPropagation();}if(!state.isAdmin){closeModal();toast('Organizer login is required.');return false;}if(!state.matches.length){closeModal();toast('Generate the qualification schedule first.');return false;}for(const m of state.matches){m.redScore=Math.floor(Math.random()*301)+50;m.blueScore=Math.floor(Math.random()*301)+50;m.redFuel=Math.floor(Math.random()*1001);m.blueFuel=Math.floor(Math.random()*1001);m.completed=true;}state.alliances=[];state.bracket=[];state.champion=null;state.celebrationShown=false;save();closeModal();render();toast(`Simulated all ${state.matches.length} qualification matches. Scores are fictional and can be edited.`);return false;}
function generateSchedule(){if(!state.isAdmin)return;if(state.matches.length&&!confirm('Replace the existing qualification schedule and clear its results?'))return;const players=assigned();if(players.length<6)return toast('You need at least 6 approved participants with unique robots.');if(players.length%6!==0)toast('Participant count is not divisible by 6; some robots will have a bye in each round.');
const n=players.length, per=state.config.matchesPerRobot||Math.max(4,Math.min(8,Math.round(6*n/Math.max(6,n))));const rounds=per;let best=null,bestCost=Infinity;
for(let trial=0;trial<450;trial++){let teamMate={},opponents={},appear={},matches=[],cost=0;players.forEach(p=>{teamMate[p.id]={};opponents[p.id]={};appear[p.id]=0});for(let r=0;r<rounds;r++){let pool=players.map(p=>p.id).sort(()=>Math.random()-.5);let roundMatches=[];while(pool.length>=6){let group=pool.splice(0,6);let bestSplit=null,bestSplitCost=Infinity;for(let k=0;k<45;k++){let sh=group.slice().sort(()=>Math.random()-.5),red=sh.slice(0,3),blue=sh.slice(3);let c=0;for(let side of [red,blue])for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)c+=10*(teamMate[side[i]][side[j]]||0);for(let a of red)for(let b of blue)c+=5*(opponents[a][b]||0);const power=ids=>ids.reduce((s,id)=>s+(robotRating(id)||50),0);c+=Math.abs(power(red)-power(blue))*.14+Math.random()*5;if(c<bestSplitCost){bestSplitCost=c;bestSplit={red,blue}}}const {red,blue}=bestSplit;roundMatches.push({red,blue});for(let side of [red,blue]){for(let id of side){appear[id]++;for(let other of side)if(other!==id)teamMate[id][other]=(teamMate[id][other]||0)+1}}for(let a of red)for(let b of blue){opponents[a][b]=(opponents[a][b]||0)+1;opponents[b][a]=(opponents[b][a]||0)+1}pool=pool;}matches.push(...roundMatches.map((m,i)=>({id:uid(),n:matches.length+i+1,round:r+1,red:m.red,blue:m.blue,completed:false,redScore:null,blueScore:null,redFuel:null,blueFuel:null})));}
// penalize repeated pairs over twice, imbalanced appearances, and schedule size
for(let id of Object.keys(teamMate)){for(let other of Object.keys(teamMate[id]))cost+=Math.max(0,(teamMate[id][other]||0)-2)*100;for(let other of Object.keys(opponents[id]))cost+=Math.max(0,(opponents[id][other]||0)-2)*45;cost+=Math.abs(appear[id]-rounds)*5}
cost+=matches.length*.01;if(cost<bestCost){bestCost=cost;best=matches}}
state.matches=best||[];state.config.matchesPerRobot=per;state.alliances=[];state.bracket=[];state.champion=null;state.celebrationShown=false;save();render();toast(`Generated ${state.matches.length} qualification matches. Review the schedule before the event.`)}
function robotRating(id){const p=state.rsvps.find(p=>p.id===id);const r=robotFor(p||{});return Number(r?.rating||50)}
function scoreMatch(id){if(!state.isAdmin)return;const m=state.matches.find(m=>m.id===id);if(!m)return;modal(`<h2>Enter match Q${m.n} result</h2><p class="redtxt">Red: ${m.red.map(i=>esc(robotFor(state.rsvps.find(p=>p.id===i)||{})?.robot||'?')).join(', ')}</p><p class="bluetxt">Blue: ${m.blue.map(i=>esc(robotFor(state.rsvps.find(p=>p.id===i)||{})?.robot||'?')).join(', ')}</p><form onsubmit="saveScore(event,'${id}')"><div class="formgrid"><div class="field"><label>Red match score</label><input id="redScore" type="number" min="0" step="1" required value="${m.redScore??''}"></div><div class="field"><label>Blue match score</label><input id="blueScore" type="number" min="0" step="1" required value="${m.blueScore??''}"></div><div class="field"><label>Red FUEL scored in active HUB(s)</label><input id="redFuel" type="number" min="0" step="1" required value="${m.redFuel??''}"></div><div class="field"><label>Blue FUEL scored in active HUB(s)</label><input id="blueFuel" type="number" min="0" step="1" required value="${m.blueFuel??''}"></div></div><p class="smalltext">Enter each alliance's total FUEL scored in active HUBs. At 500 FUEL, an alliance earns Energized RP; at 900 FUEL, it earns both Energized and Supercharged RP. Win = 3 RP, tie = 1 RP, loss = 0 RP. Climb RP is excluded.</p><div class="row" style="margin-top:14px"><button class="btn primary">Save result</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
function saveScore(e,id){e.preventDefault();const m=state.matches.find(m=>m.id===id),r=Number($('#redScore').value),b=Number($('#blueScore').value),rf=Number($('#redFuel').value),bf=Number($('#blueFuel').value);if(![r,b,rf,bf].every(Number.isFinite)||[r,b,rf,bf].some(v=>v<0||!Number.isInteger(v)))return toast('Enter valid non-negative whole numbers.');m.redScore=r;m.blueScore=b;m.redFuel=rf;m.blueFuel=bf;m.completed=true;save();closeModal();render();toast('Match result saved; standings updated.')}
function rankings(){const all=activeRsvps().filter(p=>robotFor(p));const stats=all.map(p=>({player:p,robot:robotFor(p).robot,played:0,wins:0,losses:0,ties:0,rp:0,winRp:0,energizedRp:0,superchargedRp:0,score:0,opponentScore:0}));const map=Object.fromEntries(stats.map(s=>[s.player.id,s]));state.matches.filter(m=>m.completed).forEach(m=>{const outcome=m.redScore===m.blueScore?'tie':m.redScore>m.blueScore?'red':'blue';for(const [side,ids,own,opp,fuel] of [['red',m.red,m.redScore,m.blueScore,Number(m.redFuel)||0],['blue',m.blue,m.blueScore,m.redScore,Number(m.blueFuel)||0]]){for(const id of ids){const s=map[id];if(!s)continue;s.played++;s.score+=own;s.opponentScore+=opp;const won=outcome===side,tied=outcome==='tie';const baseRp=won?3:tied?1:0;const energized=fuel>=500?1:0;const supercharged=fuel>=900?1:0;s.rp+=baseRp+energized+supercharged;s.winRp+=baseRp;s.energizedRp+=energized;s.superchargedRp+=supercharged;if(won)s.wins++;else if(!tied)s.losses++;else s.ties++}}});return stats.sort((a,b)=>b.rp-a.rp||(b.score-b.opponentScore)-(a.score-a.opponentScore)||b.score-a.score||a.robot.localeCompare(b.robot))}

function currentDraftAlliance(){
 if(!state.alliances.length)return -1;
 const n=state.alliances.length, rounds=Math.max(0,Number(state.config.allianceSize||3)-1);
 if(!Array.isArray(state.draftPickCounts)||state.draftPickCounts.length!==n)state.draftPickCounts=state.alliances.map(a=>Math.max(0,(a.members?.length||1)-1));
 for(let round=0;round<rounds;round++){
  const order=Array.from({length:n},(_,i)=>i);if(round%2===1)order.reverse();
  for(const i of order){
   const picks=Math.max(0,Number(state.draftPickCounts[i]||0));
   const members=state.alliances[i].members||[];
   if(picks<=round && members.length<Number(state.config.allianceSize||3))return i;
  }
 }
 return -1;
}

function startAllianceSelection(){if(!state.isAdmin)return;const r=rankings();if(r.length<state.config.playoffAlliances)return toast('Not enough ranked robots for that many alliances.');if(state.matches.some(m=>!m.completed))return toast('Complete all qualification matches before starting alliance selection.');if(state.alliances.length&&!confirm('Replace current alliance selections?'))return;const n=state.config.playoffAlliances;state.alliances=Array.from({length:n},(_,i)=>({members:i<r.length?[r[i].player.id]:[]}));state.draftPickCounts=Array(n).fill(0);state.bracket=[];state.champion=null;save();render();toast('Captains set. Snake draft started with Alliance 1.');}
function addPick(i){if(!state.isAdmin)return;const current=currentDraftAlliance();if(i!==current)return toast(current<0?'The draft is complete.':`It's Alliance ${current+1}'s turn to pick.`);const round=Math.max(0,Number(state.draftPickCounts?.[i]||0)),used=new Set(state.alliances.flatMap(a=>(a.members||[]).map(String))),ranked=rankings(),available=ranked.filter(s=>!used.has(String(s.player.id)));if(!available.length)return toast('No unpicked teams remain to select.');modal(`<h2>Alliance ${i+1}: select partner</h2><p>Only robots not already assigned to any alliance can be selected. Alliance order reverses each round.</p><form onsubmit="savePick(event,${i},-1)"><div class="field"><label>Available robot</label><select id="pickPlayer" required>${available.map(s=>`<option value="${s.player.id}">${esc(s.robot)} — ${esc(s.player.name)} (${s.rp} RP)</option>`).join('')}</select></div><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Confirm pick</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`)}

function savePick(e,i,j){
 if(e){e.preventDefault();e.stopPropagation()}
 if(!state.isAdmin)return toast('Organizer access required.');
 const field=$('#pickPlayer');if(!field)return;
 const id=String(field.value),a=state.alliances[i];if(!a)return toast('Alliance not found.');
 if(j<0){
  const current=currentDraftAlliance();
  if(current!==i)return toast(current<0?'The draft is complete.':`It's Alliance ${current+1}'s turn to pick.`);
  if(a.members.length>=Number(state.config.allianceSize||3))return toast('Alliance is full.');
  const used=new Set(state.alliances.flatMap(x=>(x.members||[]).map(String)));
  if(used.has(id))return toast('That robot is already assigned to an alliance. Choose an unpicked robot.');
  a.members.push(id);
  if(!Array.isArray(state.draftPickCounts)||state.draftPickCounts.length!==state.alliances.length)state.draftPickCounts=state.alliances.map(()=>0);
  state.draftPickCounts[i]=Math.max(0,Number(state.draftPickCounts[i]||0))+1;
 }else{
  const current=a.members[j];if(!current)return toast('Pick not found.');
  const duplicate=state.alliances.some((x,idx)=>idx!==i&&x.members.some(memberId=>String(memberId)===id));
  if(duplicate)return toast('That robot is already assigned to another alliance.');
  a.members[j]=id;
 }
 // Validate uniqueness before saving; never silently move or delete teams.
 const allIds=state.alliances.flatMap(x=>(x.members||[]).map(String));
 if(new Set(allIds).size!==allIds.length)return toast('Duplicate robot detected. Pick was not saved; please reset and recreate the draft.');
 state.bracket=[];state.champion=null;save();closeModal();render();toast(j<0?'Alliance pick saved.':'Alliance pick updated.');

 const finals=['F1','F2','F3'].map(id=>state.bracket.find(m=>m.id===id)).filter(Boolean);
 const f1=finals[0],f2=finals[1],f3=finals[2];

 if(f1&&f2&&f1.completed&&f2.completed){

function settingsPage(){return pageHead('Configuration','Event settings','Set event details, match generation preferences, and alliance size.')+
(!state.isAdmin?`<div class="panel"><h2>Organizer access required</h2><p>Sign in with the authorized organizer account to view or change event settings.</p><button class="btn primary" onclick="toggleAdmin()">Organizer login</button></div>`:`<div class="panel"><h2>Event setup</h2><form onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>Event name</label><input id="eventName" value="${esc(state.eventName)}" required></div><div class="field"><label>Game</label><input value="2026 REBUILT" disabled></div><div class="field"><label>Qualification matches per robot (0 = auto)</label><input id="matchesPerRobot" type="number" min="0" max="12" value="${state.config.matchesPerRobot}"></div><div class="field"><label>Playoff alliance size</label><select id="allianceSize"><option ${state.config.allianceSize===2?'selected':''}>2</option><option ${state.config.allianceSize===3?'selected':''}>3</option><option ${state.config.allianceSize===4?'selected':''}>4</option></select></div><div class="field"><label>Number of playoff alliances</label><select id="playoffAlliances">${[4,6,8,10,12,16].map(n=>`<option ${state.config.playoffAlliances===n?'selected':''}>${n}</option>`).join('')}</select></div></div><button class="btn primary" style="margin-top:15px" onclick="saveSettings(event)">Save settings</button></form></div>
<div class="panel"><h2>RP calculation</h2><div class="notice">Custom tournament rules: win = 3 RP, tie = 1 RP, loss = 0 RP. Energized RP requires 500 FUEL scored in active HUBs; Supercharged RP requires 900 FUEL. At 900 FUEL, the alliance earns both bonus RPs. Climb / Traversal RP is excluded.</div><p>FUEL totals are entered separately from match score when recording each qualification result. Score differential is the first leaderboard tie-breaker, followed by total score.</p></div>
<div class="panel"><h2>Data management</h2><p>Export a backup or reset the shared tournament data. Changes are saved to the shared database when you are signed in as an organizer.</p><div class="row" style="margin-top:12px"><button class="btn" onclick="exportData()">Export backup JSON</button><button class="btn" onclick="importDataPrompt()">Import backup JSON</button><button class="btn danger" onclick="resetEvent()">Reset all tournament data</button></div></div>
<div class="panel"><h2>Excluded robots</h2><span class="pill red">High Tide</span> <span class="pill red">9442</span><p class="smalltext">These names are filtered out of the robot inventory.</p></div>`)}
function saveSettings(e){e.preventDefault();if(!state.isAdmin)return toast('Organizer login required to change settings.');state.eventName=$('#eventName').value.trim();state.config.matchesPerRobot=Number($('#matchesPerRobot').value);state.config.allianceSize=Number($('#allianceSize').value);state.config.playoffAlliances=Number($('#playoffAlliances').value);save();render();toast('Settings saved.')}
function exportData(){const blob=new Blob([JSON.stringify({...state,isAdmin:false},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rebuildsim-tournament-backup.json';a.click();URL.revokeObjectURL(url)}
function importDataPrompt(){modal(`<h2>Import backup</h2><form onsubmit="importData(event)"><div class="field"><label>Paste exported JSON backup</label><textarea id="backupText" rows="8" style="width:100%;background:#0c141d;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px"></textarea></div><button class="btn primary" style="margin-top:12px" onclick="importData(event)">Import data</button></form>`)}
function importData(e){e.preventDefault();if(!state.isAdmin)return toast('Organizer login required to import a backup.');try{const d=JSON.parse($('#backupText').value);if(!Array.isArray(d.rsvps)||!Array.isArray(d.matches))throw Error();state={...fresh(),...d,isAdmin:true};save();closeModal();render();toast('Backup imported.')}catch{toast('Invalid backup file.')}}
function resetEvent(){if(!state.isAdmin||!confirm('Permanently reset all tournament data in this browser? Export a backup first if needed.'))return;const name=state.eventName;state=fresh();state.eventName=name;save();render();toast('Tournament data reset.')}
function toggleAdmin(){if(state.isAdmin){cloud.auth.signOut().finally(()=>{state.isAdmin=false;render();toast('Organizer signed out.');});return}modal(`<h2>Organizer login</h2><p>Sign in with the organizer account authorized for this tournament.</p><form onsubmit="login(event)"><div class="field"><label>Email</label><input id="organizerEmail" type="email" autocomplete="username" required autofocus></div><div class="field" style="margin-top:10px"><label>Password</label><input id="organizerPassword" type="password" autocomplete="current-password" required></div><div class="row" style="margin-top:14px"><button class="btn primary" type="submit">Log in</button><button class="btn" type="button" onclick="closeModal()">Cancel</button></div></form>`)}
async function login(e){if(e){e.preventDefault();e.stopPropagation()}const email=$('#organizerEmail')?.value.trim(),password=$('#organizerPassword')?.value;if(!email||!password)return false;const {error}=await cloud.auth.signInWithPassword({email,password});if(error){toast('Login failed: '+error.message);return false;}const ok=await refreshOrganizerAccess();if(!ok){toast('This account is not authorized as a tournament organizer.');return false;}closeModal();toast('Organizer mode enabled.');return false;}
function modal(html){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function go(page){state.page=page;render()}
function render(){save();const pages={dashboard,rsvp:rsvpPage,schedule:schedulePage,leaderboard:leaderboardPage,alliances:alliancesPage,bracket:bracketPage,settings:settingsPage};appShell((pages[state.page]||dashboard)())}
window.go=go;window.toggleAdmin=toggleAdmin;window.loadRebuildSimRoster=loadRebuildSimRoster;window.showAddPlayer=showAddPlayer;window.addPlayer=addPlayer;window.publicRsvp=publicRsvp;window.approvePlayer=approvePlayer;window.removePlayer=removePlayer;window.confirmRemovePlayer=confirmRemovePlayer;window.showRobotImport=showRobotImport;window.importRobots=importRobots;window.assignRobot=assignRobot;window.saveAssignment=saveAssignment;window.randomAssignRobots=randomAssignRobots;window.confirmRandomAssignRobots=confirmRandomAssignRobots;window.unassignRobot=unassignRobot;window.generateSchedule=generateSchedule;window.simulateAllQuals=simulateAllQuals;window.confirmSimulateAllQuals=confirmSimulateAllQuals;window.scoreMatch=scoreMatch;window.saveScore=saveScore;window.startAllianceSelection=startAllianceSelection;window.currentDraftAlliance=currentDraftAlliance;window.addPick=addPick;window.changePick=changePick;window.savePick=savePick;window.resetAlliances=resetAlliances;window.generateBracket=generateBracket;window.simulateElims=simulateElims;window.confirmSimulateElims=confirmSimulateElims;window.scorePlayoff=scorePlayoff;window.savePlayoff=savePlayoff;window.celebrate=celebrate;window.saveSettings=saveSettings;window.exportData=exportData;window.importDataPrompt=importDataPrompt;window.importData=importData;window.resetEvent=resetEvent;window.login=login;window.closeModal=closeModal;
render();
cloud.auth.onAuthStateChange((_event,session)=>{if(!session){state.isAdmin=false;render();}});
initCloud();
// Power-on logo sequence: use the exact team logo already embedded in the header.
const bootScreen=document.getElementById('boot-screen');
const bootLogo=document.getElementById('boot-logo');
const headerLogo=document.querySelector('.team-logo');
if(bootLogo&&headerLogo) bootLogo.src=headerLogo.currentSrc||headerLogo.src;
if(bootScreen){
  const finishBoot=()=>{bootScreen.classList.add('boot-out');setTimeout(()=>bootScreen.remove(),650)};
  setTimeout(finishBoot,3200);
  bootScreen.addEventListener('click',finishBoot,{once:true});
}
})();
</script>
